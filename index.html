<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 85%;
        }
        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 25px;
        }
        ..btn-container {
    display: flex; /* Ye buttons ko side-by-side layega */
    justify-content: center; /* Center me align karega */
    align-items: center;
    gap: 20px; /* Dono buttons ke beech ka space */
    margin-top: 20px; /* Question aur buttons ke beech ka gap */
    min-height: 60px; /* Taaki button overlap na karein */
}

button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 10px;
}
        
        #yesBtn {
            background-color: #28a745;
            color: white;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            position: absolute;
        }
        #message {
            display: none;
            font-size: 20px;
            color: #d63384;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="question">Will you be my special person? ❤️</h1>
        
        <div class="btn-container" id="btnGroup">
            <button id="yesBtn" onclick="celebrate()">YES 💖</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">NO 😜</button>
        </div>

        <div id="message">
            Yaaay! I Love You So Much sister! 🎉❤️✨
        </div>
    </div>

    <script>
        function moveButton() {
            let x = Math.random() * (window.innerWidth - 120);
            let y = Math.random() * (window.innerHeight - 60);
            let noBtn = document.getElementById("noBtn");
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        function celebrate() {
            document.getElementById("question").style.display = "none";
            document.getElementById("btnGroup").style.display = "none";
            document.getElementById("message").style.display = "block";
        }
    </script>

</body>
</html>
